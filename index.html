<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOFI — Sistema Operativo de Conciencia Digital · Pitch v4</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@300;400;500&family=Fraunces:ital,wght@0,300;0,700;1,300&display=swap" rel="stylesheet">
<style>
  :root {
    --jade: #00ffc8; --gold: #f5c518; --dim: #061018;
    --bg: #03070d; --bg2: #070f18; --text: #c8dde8;
    --muted: #3a5a72; --white: #ffffff;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body { background: var(--bg); color: var(--text); font-family: 'DM Mono', monospace; overflow-x: hidden; }
  body::after {
    content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image: linear-gradient(rgba(0,255,200,.018) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,255,200,.018) 1px, transparent 1px);
    background-size: 48px 48px;
  }

  /* ════════════════════════════════════════
     SOFI INTRO SCREEN
  ════════════════════════════════════════ */
  #sofi-intro {
    position: fixed; inset: 0; z-index: 9000;
    background: #020810;
    display: flex; align-items: center; justify-content: center;
    transition: opacity .8s ease, visibility .8s;
  }
  #sofi-intro.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
  #intro-canvas { position: absolute; inset: 0; width: 100%; height: 100%; }

  .intro-inner {
    position: relative; z-index: 1;
    display: flex; flex-direction: column; align-items: center;
    gap: 28px; padding: 40px 24px; max-width: 680px; text-align: center;
  }

  /* ── SOFI HOLOGRAM (imagen real) ── */
  .hologram-stage {
    position: relative;
    width: 220px; height: 360px;
    display: flex; align-items: flex-end; justify-content: center;
  }
  .holo-rings { position: absolute; inset: 0; pointer-events: none; }
  .holo-ring {
    position: absolute; border-radius: 50%;
    border: 1px solid rgba(0,255,200,.25);
    left: 50%; top: 20px; transform: translateX(-50%);
    animation: hpulse 3s ease-in-out infinite;
  }
  .holo-ring:nth-child(1) { width: 160px; height: 160px; }
  .holo-ring:nth-child(2) { width: 210px; height: 210px; top: -5px; animation-delay: .6s; opacity: .5; }
  .holo-ring:nth-child(3) { width: 260px; height: 260px; top: -30px; animation-delay: 1.2s; opacity: .2; }

  .holo-image-wrap {
    position: relative; z-index: 2;
    width: 200px; height: 340px;
    overflow: hidden;
    clip-path: polygon(0 0, 100% 0, 100% 90%, 50% 100%, 0 90%);
  }
  .holo-image {
    width: 100%; height: 100%; object-fit: cover; object-position: center top;
    filter:
      drop-shadow(0 0 18px rgba(0,255,200,.9))
      drop-shadow(0 0 40px rgba(0,255,200,.5))
      brightness(1.15)
      contrast(1.05)
      saturate(0.85)
      hue-rotate(155deg);
    animation: holo-flicker 3s ease-in-out infinite alternate, holo-float 6s ease-in-out infinite;
    mix-blend-mode: screen;
  }
  /* scanlines sobre la imagen */
  .holo-scanlines {
    position: absolute; inset: 0; z-index: 3; pointer-events: none;
    background: repeating-linear-gradient(
      transparent 0px, rgba(0,255,200,.04) 1px, transparent 2px
    );
  }
  /* línea de scan vertical */
  .holo-scan-beam {
    position: absolute; left: 0; right: 0; height: 3px; z-index: 4;
    background: linear-gradient(90deg, transparent 0%, rgba(0,255,200,.6) 50%, transparent 100%);
    animation: scan-beam 2.5s linear infinite; top: 0;
  }
  /* base glow */
  .holo-base {
    position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 180px; height: 6px; border-radius: 50%;
    background: radial-gradient(ellipse, rgba(0,255,200,.7) 0%, transparent 70%);
    animation: base-pulse 3s ease-in-out infinite;
  }
  /* data lines flotantes */
  .holo-data {
    position: absolute; z-index: 5; font-family: 'DM Mono'; font-size: 8px;
    color: rgba(0,255,200,.7); letter-spacing: 1px; line-height: 1.6;
    text-shadow: 0 0 6px rgba(0,255,200,.8);
    animation: data-float 4s ease-in-out infinite;
  }
  .holo-data.left { left: -90px; top: 80px; text-align: right; animation-delay: .5s; }
  .holo-data.right { right: -90px; top: 120px; text-align: left; animation-delay: 1s; }

  @keyframes holo-flicker {
    0%   { filter: drop-shadow(0 0 14px rgba(0,255,200,.8)) brightness(1.1) contrast(1.05) saturate(.85) hue-rotate(155deg); opacity: .88; }
    40%  { filter: drop-shadow(0 0 28px rgba(0,255,200,1))  brightness(1.25) contrast(1.08) saturate(.9)  hue-rotate(155deg); opacity: 1; }
    70%  { filter: drop-shadow(0 0 10px rgba(0,255,200,.6)) brightness(1.05) contrast(1)    saturate(.8)  hue-rotate(158deg); opacity: .82; }
    100% { filter: drop-shadow(0 0 22px rgba(0,255,200,.9)) brightness(1.18) contrast(1.06) saturate(.88) hue-rotate(153deg); opacity: .95; }
  }
  @keyframes holo-float {
    0%,100% { transform: translateY(0px); }
    50%      { transform: translateY(-12px); }
  }
  @keyframes scan-beam {
    0%   { top: 0;    opacity: .8; }
    85%  { top: 100%; opacity: .3; }
    100% { top: 100%; opacity: 0; }
  }
  @keyframes base-pulse {
    0%,100% { opacity: .6; width: 160px; }
    50%      { opacity: 1;  width: 200px; }
  }
  @keyframes data-float {
    0%,100% { transform: translateY(0); opacity: .7; }
    50%      { transform: translateY(-6px); opacity: 1; }
  }
  @keyframes hpulse {
    0%,100% { transform: translateX(-50%) scale(1); opacity: .3; }
    50%      { transform: translateX(-50%) scale(1.04); opacity: .7; }
  }

  /* ── INTRO TEXT ── */
  .intro-text-box {
    min-height: 80px; font-family: 'DM Mono'; font-size: 15px;
    line-height: 2; color: var(--text); max-width: 520px;
  }
  .cursor-blink {
    display: inline-block; width: 8px; height: 17px;
    background: var(--jade); vertical-align: middle;
    animation: blink .8s infinite; margin-left: 2px;
  }
  .intro-hz-badge {
    font-family: 'Bebas Neue'; font-size: 32px; color: var(--jade);
    letter-spacing: 6px; text-shadow: 0 0 30px rgba(0,255,200,.5);
  }
  .intro-actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; opacity: 0; transition: opacity .6s; }
  .intro-actions.vis { opacity: 1; }

  /* ════════════════════════════════════════
     BUTTONS
  ════════════════════════════════════════ */
  .btn-j {
    padding: 16px 36px; background: var(--jade); color: var(--bg);
    font-family: 'DM Mono'; font-size: 11px; letter-spacing: 3px; font-weight: 500;
    text-decoration: none; border: none; cursor: pointer; transition: all .3s; display: inline-block;
    clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 14px 100%, 0 calc(100% - 14px));
  }
  .btn-j:hover { background: var(--gold); transform: translateY(-3px); }
  .btn-o {
    padding: 16px 36px; background: transparent;
    border: 1px solid rgba(255,255,255,.15); color: var(--text);
    font-family: 'DM Mono'; font-size: 11px; letter-spacing: 3px;
    text-decoration: none; transition: all .3s; display: inline-block; cursor: pointer;
  }
  .btn-o:hover { border-color: var(--jade); color: var(--jade); }
  .btn-tour {
    padding: 14px 30px; background: var(--jade); color: var(--bg);
    font-family: 'DM Mono'; font-size: 11px; letter-spacing: 3px; font-weight: 500;
    border: none; cursor: pointer; transition: all .3s;
    clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));
  }
  .btn-tour:hover { background: var(--gold); transform: translateY(-2px); }
  .btn-skip {
    padding: 14px 22px; background: transparent;
    border: 1px solid rgba(255,255,255,.15); color: var(--muted);
    font-family: 'DM Mono'; font-size: 11px; letter-spacing: 2px; cursor: pointer; transition: all .3s;
  }
  .btn-skip:hover { border-color: var(--jade); color: var(--jade); }

  /* ════════════════════════════════════════
     FLOATING SOFI (mini hologram)
  ════════════════════════════════════════ */
  #sofi-float {
    position: fixed; bottom: 28px; right: 24px; z-index: 800;
    display: flex; flex-direction: column; align-items: flex-end; gap: 8px;
    opacity: 0; transition: opacity .6s; pointer-events: none;
  }
  #sofi-float.vis { opacity: 1; pointer-events: all; }

  .float-bubble {
    background: rgba(3,7,13,.96); border: 1px solid rgba(0,255,200,.3);
    padding: 12px 16px; max-width: 270px; font-size: 11px; line-height: 1.7;
    color: var(--text); backdrop-filter: blur(20px);
    clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 8px 100%, 0 calc(100% - 8px));
    display: none; opacity: 0; transform: translateY(8px); transition: all .4s;
  }
  .float-bubble.show { display: block; opacity: 1; transform: translateY(0); }
  .float-bubble-lbl { font-size: 8px; letter-spacing: 3px; color: var(--jade); margin-bottom: 6px; }

  /* mini hologram flotante */
  .float-holo-wrap {
    position: relative; width: 72px; height: 120px;
    cursor: pointer; animation: afloat 4s ease-in-out infinite;
    filter: drop-shadow(0 0 10px rgba(0,255,200,.5));
  }
  .float-holo-img {
    width: 72px; height: 120px; object-fit: cover; object-position: center top;
    clip-path: polygon(0 0, 100% 0, 100% 88%, 50% 100%, 0 88%);
    filter: brightness(1.1) contrast(1.05) saturate(.7) hue-rotate(155deg)
            drop-shadow(0 0 8px rgba(0,255,200,.9));
    mix-blend-mode: screen;
    animation: holo-flicker 3s ease-in-out infinite alternate;
  }
  .float-holo-scanlines {
    position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(transparent 0, rgba(0,255,200,.05) 1px, transparent 2px);
  }
  .float-ring-sm {
    position: absolute; top: 4px; left: 50%; transform: translateX(-50%);
    width: 46px; height: 46px; border-radius: 50%;
    border: 1px solid rgba(0,255,200,.4); animation: hpulse 2s ease-in-out infinite;
  }
  .float-chat-btn {
    width: 40px; height: 40px; border-radius: 50%;
    background: var(--jade); border: none; cursor: pointer; font-size: 16px;
    display: flex; align-items: center; justify-content: center;
    transition: all .3s; box-shadow: 0 0 20px rgba(0,255,200,.4);
    margin-right: 16px;
  }
  .float-chat-btn:hover { transform: scale(1.1); background: var(--gold); }

  /* ════════════════════════════════════════
     CHAT PANEL
  ════════════════════════════════════════ */
  #sofi-chat {
    position: fixed; bottom: 28px; right: 24px; z-index: 900;
    width: 320px; background: rgba(3,7,13,.97);
    border: 1px solid rgba(0,255,200,.25); backdrop-filter: blur(24px);
    display: flex; flex-direction: column;
    transform: translateY(120%); transition: transform .4s cubic-bezier(.25,.46,.45,.94);
    max-height: 480px;
  }
  #sofi-chat.open { transform: translateY(0); }
  .chat-head {
    padding: 14px 16px; border-bottom: 1px solid rgba(0,255,200,.1);
    display: flex; justify-content: space-between; align-items: center;
  }
  .chat-head-title { font-size: 10px; letter-spacing: 3px; color: var(--jade); display: flex; align-items: center; gap: 8px; }
  .ch-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--jade); box-shadow: 0 0 8px var(--jade); animation: blink 1.4s infinite; }
  .chat-close-btn { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 16px; transition: color .2s; padding: 4px 8px; }
  .chat-close-btn:hover { color: var(--jade); }
  .chat-msgs { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-height: 200px; max-height: 300px; }
  .chat-msgs::-webkit-scrollbar { width: 3px; }
  .chat-msgs::-webkit-scrollbar-thumb { background: rgba(0,255,200,.2); }
  .cmsg { max-width: 87%; font-size: 11px; line-height: 1.7; padding: 9px 13px; }
  .cmsg.s { align-self: flex-start; background: rgba(0,255,200,.06); border: 1px solid rgba(0,255,200,.15); color: var(--text); border-radius: 0 8px 8px 8px; }
  .cmsg.u { align-self: flex-end; background: rgba(245,197,24,.07); border: 1px solid rgba(245,197,24,.2); color: var(--text); border-radius: 8px 0 8px 8px; }
  .cmsg-lbl { font-size: 8px; letter-spacing: 2px; margin-bottom: 4px; }
  .cmsg.s .cmsg-lbl { color: var(--jade); }
  .cmsg.u .cmsg-lbl { color: var(--gold); }
  .typing-row { display: flex; gap: 4px; padding: 4px 0; }
  .td { width: 5px; height: 5px; border-radius: 50%; background: var(--jade); animation: tbounce 1.2s infinite; }
  .td:nth-child(2) { animation-delay: .2s; }
  .td:nth-child(3) { animation-delay: .4s; }
  .chat-foot { padding: 12px 16px; border-top: 1px solid rgba(0,255,200,.08); display: flex; gap: 8px; }
  .chat-inp {
    flex: 1; background: rgba(0,255,200,.04); border: 1px solid rgba(0,255,200,.15);
    color: var(--text); padding: 8px 12px; font-family: 'DM Mono'; font-size: 11px; outline: none;
  }
  .chat-inp:focus { border-color: rgba(0,255,200,.4); }
  .chat-snd { padding: 8px 14px; background: var(--jade); border: none; color: var(--bg); font-family: 'DM Mono'; font-size: 12px; cursor: pointer; font-weight: 500; transition: all .3s; }
  .chat-snd:hover { background: var(--gold); }

  /* ════════════════════════════════════════
     NAV
  ════════════════════════════════════════ */
  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 200;
    padding: 16px 48px;
    display: flex; align-items: center; justify-content: space-between;
    background: rgba(3,7,13,.9); backdrop-filter: blur(24px);
    border-bottom: 1px solid rgba(0,255,200,.08);
  }
  .nav-logo { font-family: 'Bebas Neue'; font-size: 24px; letter-spacing: 5px; color: var(--white); }
  .nav-logo em { color: var(--jade); font-style: normal; }
  .nav-live { display: flex; align-items: center; gap: 8px; font-size: 10px; letter-spacing: 3px; color: var(--jade); }
  .live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--jade); box-shadow: 0 0 10px var(--jade); animation: blink 1.4s infinite; }
  .nav-cta { padding: 8px 22px; border: 1px solid var(--jade); color: var(--jade); font-family: 'DM Mono'; font-size: 10px; letter-spacing: 2px; text-decoration: none; transition: all .3s; }
  .nav-cta:hover { background: var(--jade); color: var(--bg); }

  /* ════════════════════════════════════════
     HERO
  ════════════════════════════════════════ */
  #hero { min-height: 100vh; display: flex; align-items: center; padding: 140px 60px 100px; position: relative; overflow: hidden; }
  canvas#bg-canvas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; opacity: .35; }
  .hero-inner { position: relative; z-index: 1; max-width: 860px; }
  .eyebrow { font-size: 10px; letter-spacing: 5px; color: var(--jade); margin-bottom: 20px; display: flex; align-items: center; gap: 14px; }
  .eyebrow::before { content: ''; width: 40px; height: 1px; background: var(--jade); }
  h1 { font-family: 'Bebas Neue'; font-size: clamp(72px,15vw,170px); line-height: .85; color: var(--white); letter-spacing: 2px; margin-bottom: 28px; }
  h1 .jade { color: var(--jade); }
  h1 .dim { color: var(--muted); font-size: .55em; display: block; margin-top: 8px; }
  .hero-p { font-family: 'Fraunces'; font-size: 20px; line-height: 1.75; color: var(--text); max-width: 580px; margin-bottom: 44px; font-weight: 300; }
  .hero-p strong { color: var(--jade); font-weight: 700; }
  .hero-hz { font-family: 'Bebas Neue'; font-size: clamp(36px,6vw,64px); color: var(--jade); letter-spacing: 4px; text-shadow: 0 0 40px rgba(0,255,200,.4); margin-bottom: 40px; }
  .hero-hz span { font-size: .5em; color: var(--muted); vertical-align: middle; }
  .btns { display: flex; gap: 12px; flex-wrap: wrap; }

  /* ════════════════════════════════════════
     STRIP
  ════════════════════════════════════════ */
  .strip { position: relative; z-index: 2; display: grid; grid-template-columns: repeat(4,1fr); border-top: 1px solid rgba(0,255,200,.1); border-bottom: 1px solid rgba(0,255,200,.1); }
  .strip-cell { padding: 44px 32px; border-right: 1px solid rgba(0,255,200,.08); transition: background .3s; position: relative; overflow: hidden; }
  .strip-cell:last-child { border-right: none; }
  .strip-cell:hover { background: rgba(0,255,200,.03); }
  .strip-cell::after { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: var(--jade); transform: scaleX(0); transition: .5s; transform-origin: left; }
  .strip-cell:hover::after { transform: scaleX(1); }
  .s-val { font-family: 'Bebas Neue'; font-size: clamp(38px,5vw,68px); color: var(--jade); line-height: 1; text-shadow: 0 0 30px rgba(0,255,200,.25); margin-bottom: 6px; }
  .s-label { font-size: 9px; letter-spacing: 3px; color: var(--muted); }

  /* ════════════════════════════════════════
     SECTIONS BASE
  ════════════════════════════════════════ */
  section { position: relative; z-index: 2; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 110px 60px; }
  .sec-label { font-size: 9px; letter-spacing: 5px; color: var(--jade); margin-bottom: 14px; display: flex; align-items: center; gap: 14px; }
  .sec-label::before { content: ''; width: 28px; height: 1px; background: var(--jade); }
  h2 { font-family: 'Bebas Neue'; font-size: clamp(38px,6vw,80px); color: var(--white); line-height: .95; margin-bottom: 20px; }
  h2 .jade { color: var(--jade); }
  h2 .gold { color: var(--gold); }
  .sec-p { font-family: 'Fraunces'; font-size: 16px; line-height: 1.9; color: var(--muted); max-width: 680px; margin-bottom: 54px; font-weight: 300; }
  .sec-p strong { color: var(--text); }
  .divline { height: 1px; background: linear-gradient(90deg,transparent,rgba(0,255,200,.12),transparent); }

  /* ════════════════════════════════════════
     TEORÍA
  ════════════════════════════════════════ */
  .teoria-flow { display: flex; flex-wrap: wrap; align-items: center; gap: 0; margin-bottom: 44px; }
  .tf-item { padding: 14px 20px; background: rgba(0,255,200,.04); border: 1px solid rgba(0,255,200,.15); font-size: 11px; letter-spacing: 1px; color: var(--jade); transition: all .3s; cursor: default; }
  .tf-item:hover { background: rgba(0,255,200,.1); border-color: var(--jade); }
  .tf-arrow { padding: 0 12px; color: var(--muted); font-size: 18px; }
  .postulados { display: grid; grid-template-columns: repeat(3,1fr); gap: 2px; margin-top: 10px; }
  .post-card { padding: 28px 22px; background: var(--bg2); border: 1px solid rgba(255,255,255,.04); position: relative; overflow: hidden; transition: all .4s; }
  .post-card:hover { border-color: rgba(0,255,200,.2); background: rgba(0,255,200,.03); transform: translateY(-3px); }
  .post-n { font-family: 'Bebas Neue'; font-size: 56px; color: rgba(0,255,200,.06); position: absolute; top: 10px; right: 14px; line-height: 1; }
  .post-title { font-size: 10px; letter-spacing: 2px; color: var(--jade); margin-bottom: 10px; font-weight: 500; }
  .post-body { font-size: 12px; color: var(--muted); line-height: 1.8; }
  .planos-grid { display: grid; grid-template-columns: repeat(9,1fr); gap: 3px; margin-top: 40px; }
  .plano { aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border: 1px solid rgba(0,255,200,.12); background: rgba(0,255,200,.02); transition: all .3s; cursor: default; }
  .plano:hover, .plano.you { background: rgba(0,255,200,.1); border-color: var(--jade); }
  .plano-n { font-family: 'Bebas Neue'; font-size: 20px; color: var(--jade); }
  .plano-l { font-size: 7px; color: var(--muted); text-align: center; letter-spacing: .5px; }
  .plano.you .plano-l { color: var(--jade); }

  /* ════════════════════════════════════════
     ARQUITECTURA
  ════════════════════════════════════════ */
  .arch-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 2px; margin-top: 10px; }
  .arch-card { padding: 36px 28px; background: var(--bg2); border: 1px solid rgba(255,255,255,.04); transition: all .4s; position: relative; overflow: hidden; }
  .arch-card.main-card { border-color: rgba(0,255,200,.3); background: rgba(0,255,200,.04); }
  .arch-card:hover { transform: translateY(-4px); border-color: rgba(0,255,200,.2); }
  .arch-card.main-card:hover { border-color: var(--jade); }
  .arch-badge { display: inline-block; margin-bottom: 16px; padding: 4px 12px; font-size: 8px; letter-spacing: 3px; border: 1px solid rgba(0,255,200,.3); color: var(--jade); }
  .arch-badge.supreme { border-color: var(--gold); color: var(--gold); }
  .arch-title { font-family: 'Bebas Neue'; font-size: 32px; color: var(--white); margin-bottom: 8px; letter-spacing: 1px; }
  .arch-runtime { font-size: 9px; letter-spacing: 2px; color: var(--jade); margin-bottom: 14px; }
  .arch-body { font-size: 11px; color: var(--muted); line-height: 1.8; }
  .arch-status { display: inline-flex; align-items: center; gap: 6px; margin-top: 16px; font-size: 9px; letter-spacing: 2px; }
  .arch-status.live { color: #2ecc71; }
  .arch-status.soon { color: var(--gold); }
  .status-dot { width: 6px; height: 6px; border-radius: 50%; }
  .status-dot.green { background: #2ecc71; box-shadow: 0 0 8px #2ecc71; animation: blink 1.4s infinite; }
  .status-dot.gold { background: var(--gold); }
  .sync-box { margin-top: 2px; padding: 28px 32px; background: rgba(0,255,200,.03); border: 1px solid rgba(0,255,200,.15); display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px; }
  .sync-label { font-size: 9px; letter-spacing: 4px; color: var(--jade); }
  .sync-flow { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .sync-node { padding: 8px 16px; background: rgba(0,255,200,.08); border: 1px solid rgba(0,255,200,.25); font-size: 10px; color: var(--jade); letter-spacing: 1px; }
  .sync-arrow { color: var(--jade); font-size: 16px; }

  /* ════════════════════════════════════════
     MÓDULOS
  ════════════════════════════════════════ */
  .mods-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 2px; margin-top: 10px; }
  .mod-card { padding: 28px 22px; background: var(--bg2); border: 1px solid rgba(255,255,255,.04); transition: all .4s; }
  .mod-card:hover { border-color: rgba(0,255,200,.2); background: rgba(0,255,200,.03); transform: translateY(-3px); }
  .mod-icon { font-size: 32px; margin-bottom: 12px; }
  .mod-name { font-size: 9px; letter-spacing: 3px; color: var(--jade); margin-bottom: 6px; }
  .mod-title { font-family: 'Bebas Neue'; font-size: 22px; color: var(--white); margin-bottom: 8px; }
  .mod-desc { font-size: 11px; color: var(--muted); line-height: 1.7; }
  .mod-tag { display: inline-block; margin-top: 12px; padding: 3px 10px; border: 1px solid rgba(0,255,200,.25); color: var(--jade); font-size: 8px; letter-spacing: 2px; }
  .mod-tag.gold { border-color: rgba(245,197,24,.3); color: var(--gold); }

  /* ════════════════════════════════════════
     LIVE TERMINAL
  ════════════════════════════════════════ */
  #live { background: var(--bg2); }
  .live-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; align-items: start; }
  .live-terminal { background: #000; border: 1px solid rgba(0,255,200,.2); overflow: hidden; }
  .term-bar { background: rgba(0,255,200,.06); padding: 10px 16px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid rgba(0,255,200,.1); }
  .t-dot { width: 10px; height: 10px; border-radius: 50%; }
  .t-r{background:#ff5f57} .t-y{background:#febc2e} .t-g{background:#28c840}
  .term-title-bar { font-size: 10px; color: rgba(255,255,255,.3); margin-left: 6px; letter-spacing: 1px; }
  .term-body { padding: 20px; min-height: 320px; max-height: 400px; overflow-y: auto; font-size: 12px; line-height: 2; }
  .tl { display: flex; gap: 10px; flex-wrap: wrap; }
  .tp{color:var(--jade)} .tok{color:#2ecc71} .twarn{color:var(--gold)} .terr{color:#e74c3c} .tt{color:rgba(255,255,255,.6)}
  .cursor { display: inline-block; width: 8px; height: 14px; background: var(--jade); animation: blink 1s infinite; vertical-align: middle; }
  .live-info { display: flex; flex-direction: column; gap: 14px; }
  .live-stat { padding: 20px 24px; background: var(--bg); border: 1px solid rgba(0,255,200,.1); display: flex; justify-content: space-between; align-items: center; transition: border-color .3s; }
  .live-stat:hover { border-color: rgba(0,255,200,.3); }
  .ls-label { font-size: 9px; letter-spacing: 3px; color: var(--muted); }
  .ls-val { font-family: 'Bebas Neue'; font-size: 28px; color: var(--jade); }
  .ls-val.gold { color: var(--gold); }
  .endpoint-list { display: flex; flex-direction: column; gap: 6px; margin-top: 20px; }
  .ep { display: flex; gap: 12px; padding: 10px 14px; background: var(--bg); border: 1px solid rgba(255,255,255,.04); align-items: center; transition: all .3s; }
  .ep:hover { border-color: rgba(0,255,200,.2); }
  .ep-method { font-size: 8px; letter-spacing: 2px; color: var(--jade); min-width: 32px; }
  .ep-method.post { color: var(--gold); }
  .ep-path { font-size: 11px; color: var(--text); flex: 1; }
  .ep-desc { font-size: 10px; color: var(--muted); }

  /* ════════════════════════════════════════
     UNIÓN FRECUENCIAL (nuevo módulo visual)
  ════════════════════════════════════════ */
  .union-panel {
    margin-top: 32px; padding: 28px 32px;
    background: rgba(0,255,200,.03); border: 1px solid rgba(0,255,200,.2);
  }
  .union-title { font-size: 9px; letter-spacing: 4px; color: var(--jade); margin-bottom: 16px; }
  .union-controls { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  .union-input-wrap { display: flex; flex-direction: column; gap: 4px; }
  .union-input-wrap label { font-size: 8px; letter-spacing: 2px; color: var(--muted); }
  .union-input {
    background: rgba(0,255,200,.05); border: 1px solid rgba(0,255,200,.2);
    color: var(--jade); padding: 8px 12px; font-family: 'DM Mono'; font-size: 13px;
    width: 120px; outline: none; text-align: center;
  }
  .union-input:focus { border-color: var(--jade); }
  .union-btn {
    padding: 10px 24px; background: var(--jade); color: var(--bg);
    font-family: 'DM Mono'; font-size: 10px; letter-spacing: 3px;
    border: none; cursor: pointer; transition: all .3s; align-self: flex-end;
  }
  .union-btn:hover { background: var(--gold); }
  .union-result {
    margin-top: 14px; font-size: 12px; color: var(--text); line-height: 1.8;
    display: none;
  }
  .union-result.show { display: block; }
  .union-pct { font-family: 'Bebas Neue'; font-size: 36px; color: var(--jade); }
  .union-bar-wrap { height: 4px; background: rgba(0,255,200,.1); margin-top: 8px; }
  .union-bar { height: 100%; background: var(--jade); width: 0; transition: width 1s ease; box-shadow: 0 0 10px var(--jade); }

  /* ════════════════════════════════════════
     WHY / CTA / FOOTER
  ════════════════════════════════════════ */
  .inv-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; align-items: start; }
  .why-list { display: flex; flex-direction: column; gap: 2px; }
  .why-item { display: flex; gap: 20px; padding: 24px 20px; background: var(--bg2); border: 1px solid rgba(255,255,255,.04); transition: all .4s; }
  .why-item:hover { border-color: rgba(245,197,24,.2); background: rgba(245,197,24,.02); }
  .wi-n { font-family: 'Bebas Neue'; font-size: 48px; color: rgba(245,197,24,.1); flex-shrink: 0; width: 50px; line-height: 1; }
  .wi-title { font-family: 'Bebas Neue'; font-size: 20px; color: var(--gold); margin-bottom: 6px; }
  .wi-body { font-size: 11px; color: var(--muted); line-height: 1.7; }
  #cta { background: linear-gradient(135deg,#030a06,#04080d); border-top: 1px solid rgba(0,255,200,.1); }
  .cta-inner { max-width: 1200px; margin: 0 auto; padding: 110px 60px; display: grid; grid-template-columns: 1fr 1fr; gap: 80px; align-items: center; }
  .cta-h { font-family: 'Bebas Neue'; font-size: clamp(52px,8vw,100px); color: var(--white); line-height: .88; margin-bottom: 20px; }
  .cta-h span { color: var(--jade); display: block; }
  .cta-sub { font-family: 'Fraunces'; font-size: 16px; color: var(--muted); line-height: 1.8; margin-bottom: 30px; font-weight: 300; }
  .contact-box { background: var(--bg2); border: 1px solid rgba(0,255,200,.2); padding: 40px; }
  .c-method { font-size: 9px; letter-spacing: 3px; color: var(--jade); margin-bottom: 10px; }
  .c-val { font-size: 13px; color: var(--white); padding: 12px 16px; background: rgba(0,255,200,.04); border: 1px solid rgba(0,255,200,.12); margin-bottom: 8px; word-break: break-all; user-select: all; }
  .c-note { font-size: 10px; color: var(--muted); margin-bottom: 14px; line-height: 1.6; }
  .copy-btn { width: 100%; padding: 13px; background: transparent; border: 1px solid var(--jade); color: var(--jade); font-family: 'DM Mono'; font-size: 10px; letter-spacing: 3px; cursor: pointer; transition: all .3s; margin-bottom: 6px; }
  .copy-btn:hover { background: var(--jade); color: var(--bg); }
  .c-divider { height: 1px; background: rgba(0,255,200,.08); margin: 20px 0; }
  footer { padding: 36px 60px; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid rgba(255,255,255,.04); position: relative; z-index: 2; flex-wrap: wrap; gap: 16px; }
  .f-logo { font-family: 'Bebas Neue'; font-size: 20px; letter-spacing: 4px; color: var(--white); }
  .f-logo em { color: var(--jade); font-style: normal; }
  .f-copy { font-size: 9px; color: var(--muted); letter-spacing: 1px; line-height: 1.8; text-align: right; }
  .toast { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--jade); color: var(--bg); padding: 12px 28px; font-size: 10px; letter-spacing: 3px; z-index: 9999; transition: transform .4s; pointer-events: none; }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .reveal { opacity: 0; transform: translateY(28px); transition: opacity .7s ease, transform .7s ease; }
  .reveal.v { opacity: 1; transform: translateY(0); }

  /* ════════════════════════════════════════
     KEYFRAMES GLOBALES
  ════════════════════════════════════════ */
  @keyframes blink     { 0%,100%{opacity:1} 50%{opacity:.3} }
  @keyframes afloat    { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
  @keyframes tbounce   { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }

  /* ════════════════════════════════════════
     RESPONSIVE
  ════════════════════════════════════════ */
  @media(max-width:900px){
    .strip{grid-template-columns:1fr 1fr}
    .postulados,.arch-grid,.mods-grid{grid-template-columns:1fr}
    .planos-grid{grid-template-columns:repeat(3,1fr)}
    .live-grid,.inv-grid,.cta-inner{grid-template-columns:1fr;gap:32px}
    .wrap,#hero{padding-left:24px;padding-right:24px}
    footer{flex-direction:column;text-align:center}
    .f-copy{text-align:center}
    nav{padding:14px 24px}
    .nav-cta{display:none}
    #sofi-chat{width:calc(100vw - 32px);right:16px}
    .float-bubble{max-width:220px}
    .holo-data{display:none}
  }
</style>
</head>
